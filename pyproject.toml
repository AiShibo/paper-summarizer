[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systems-phd-explorer"
version = "0.1.0"
description = "Conflict-resistant data pipeline and static explorer for systems PhD research discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.scripts]
systems-phd-explorer = "systems_phd_explorer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
